# Builds Leela and publishes it to GitHub Pages (the gh-pages branch) on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # With a custom domain (repository variable LEELA_DOMAIN, e.g. leela.baby) the app lives at
      # the root of that domain; without one it's at <user>.github.io/leela/.
      - run: npm run build
        env:
          LEELA_BASE: ${{ vars.LEELA_DOMAIN && '/' || '/leela/' }}
      - name: Publish to the gh-pages branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOMAIN: ${{ vars.LEELA_DOMAIN }}
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          if [ -n "$DOMAIN" ]; then echo "$DOMAIN" > dist/CNAME; fi
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
