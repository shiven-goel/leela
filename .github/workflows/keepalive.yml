# The free database pauses after a quiet week. One tiny request a day keeps it awake, even if
# the family takes a holiday from logging. GitHub also stops scheduled jobs in a repo with no
# commits for 60 days, so this job makes a small commit when the repo has been quiet for 45.
name: Keep the database awake

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ping the database
        run: |
          set -a; . ./.env.production; set +a
          curl -fsS -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}'
          echo
      - name: Keep scheduled jobs alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%FT%TZ > .github/last-keepalive
            git add .github/last-keepalive
            git commit -m "Keep scheduled jobs alive"
            git push
          fi
