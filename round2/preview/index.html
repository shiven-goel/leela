    <!-- Dark from the very first frame: never a bright white flash near a sleeping baby. -->
    <style>html,body{color:#eceae4;background:#0e1120}html[data-theme=day],html[data-theme=day] body{background:#f1f3fa}html[data-theme=night],html[data-theme=night] body{background:#0a0d1d}</style>
    <script>
      // Apply the saved theme before the first paint. Dark unless someone chose day or night.
      try {
        var t = localStorage.getItem('leela-theme');
        document.documentElement.dataset.theme = t === 'day' || t === 'night' ? t : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
