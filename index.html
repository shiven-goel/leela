<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F1F3FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0D1D" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Leela" />
    <meta name="description" content="Your baby’s day, shared by the whole family." />
    <title>Leela</title>
    <script>
      // Apply the saved theme before the first paint, so night mode never flashes white.
      try {
        var t = localStorage.getItem('leela-theme') || 'auto';
        var h = new Date().getHours();
        var night = t === 'night' || (t === 'auto' && (h >= 19 || h < 7));
        document.documentElement.dataset.theme = night ? 'night' : 'day';
      } catch (e) {
        document.documentElement.dataset.theme = 'day';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
